{% extends "publicbb/base.html" %}
{% block title %}{{ _('Set New Password | Business Better') }}{% endblock %}

{% block content %}
<section class="py-5 d-flex align-items-center" style="min-height: 70vh; background: var(--bb-bg);">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-white mb-1 font-heading">{{ _('Create New Password') }}</h3>
                    <p class="text-secondary small">{{ _('Choose a strong password for your account.') }}</p>
                </div>

                <div class="b2b-card p-4">
                    <form action="{{ request.url }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-semibold">{{ _('New Password') }}</label>
                            <input type="password" name="password" class="form-control" required minlength="8">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-secondary fw-semibold">{{ _('Confirm Password') }}</label>
                            <input type="password" name="confirm_password" class="form-control" required minlength="8">
                        </div>
                        <button type="submit" class="btn btn-brand w-100 py-2">{{ _('Save & Login') }}</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
