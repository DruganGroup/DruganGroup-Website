{% extends "portal/portal_base.html" %}

{% block title %}Account Settings | {{ company_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold m-0">Account Settings</h2>
        <p class="text-muted mb-0">Manage your contact information and password.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="m-0 fw-bold"><i class="fas fa-user-cog me-2 text-brand"></i>Your Profile</h5>
            </div>
            <div class="card-body p-4">
                <form action="/portal/settings" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Full Name</label>
                            <input type="text" name="name" class="form-control bg-light" value="{{ client.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                            <input type="email" class="form-control bg-light text-muted" value="{{ client.email }}" disabled title="Contact the office to change your primary email.">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Phone Number</label>
                            <input type="text" name="phone" class="form-control bg-light" value="{{ client.phone }}">
                        </div>
                    </div>
                    
                    <hr class="mb-4">
                    
                    <h6 class="fw-bold mb-3"><i class="fas fa-lock me-2 text-brand"></i>Security</h6>
                    <p class="small text-muted mb-3">Leave blank if you do not want to change your password.</p>
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">New Password</label>
                            <input type="password" name="password" class="form-control bg-light" placeholder="••••••••">
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-brand fw-bold px-4"><i class="fas fa-save me-2"></i>Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
