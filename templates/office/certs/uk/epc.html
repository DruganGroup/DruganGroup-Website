<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EPC Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; -webkit-print-color-adjust: exact; }
        .cert-container { max-width: 900px; margin: 30px auto; background: white; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #198754; }
        .section-header { background: #212529; color: white; padding: 8px 15px; font-weight: bold; text-transform: uppercase; margin-top: 25px; font-size: 0.85rem; letter-spacing: 0.5px; }
        .form-label { font-size: 0.75rem; font-weight: bold; color: #555; text-transform: uppercase; }
        canvas#signature-pad { border: 2px dashed #ccc; border-radius: 4px; width: 100%; height: 100px; cursor: crosshair; }
    </style>
</head>
<body>

<div class="cert-container">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h3 class="fw-bold m-0 text-dark">ENERGY PERFORMANCE CERTIFICATE</h3>
            <p class="text-muted small m-0">Standard EPC Assessment Form</p>
        </div>
        <div class="text-end">
            <h2 class="fw-bold text-success mb-0"><i class="fas fa-leaf me-2"></i>EPC</h2>
        </div>
    </div>

    <form id="epcForm">
        <input type="hidden" name="prop_id" value="{{ prop.id }}">
        
        <div class="row g-4 mb-3">
            <div class="col-md-6">
                <div class="p-3 border rounded bg-light h-100">
                    <label class="form-label text-primary">Site Address</label>
                    <div class="fw-bold fs-5">{{ prop.address }}</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 border rounded bg-light h-100">
                    <label class="form-label text-primary">{{ _('Client') }}</label>
                    <div class="fw-bold fs-5">{{ prop.client }}</div>
                </div>
            </div>
        </div>

        <div class="section-header">Assessment Details</div>
        <div class="p-3 border rounded mb-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Property Type</label>
                    <select name="prop_type" class="form-select form-select-sm fw-bold">
                        <option>Detached House</option><option>Semi-Detached</option><option>Terraced</option><option>Flat/Apartment</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Total Floor Area (m²)</label>
                    <input type="number" name="floor_area" class="form-control form-control-sm fw-bold">
                </div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-6">
                    <label class="form-label">Current Energy Rating (A-G)</label>
                    <select name="rating" class="form-select form-select-sm fw-bold">
                        <option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Potential Energy Rating (A-G)</label>
                    <select name="potential_rating" class="form-select form-select-sm fw-bold">
                        <option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-header">Recommendations</div>
        <div class="p-3 border rounded mb-3">
            <textarea name="recommendations" class="form-control form-control-sm" rows="3" placeholder="e.g. Install loft insulation, upgrade boiler..."></textarea>
        </div>

        <div class="row mt-3">
            <div class="col-md-4 ms-auto">
                <div class="border p-3 rounded text-center bg-warning-subtle border-warning h-100 d-flex flex-column justify-content-center">
                    <small class="text-muted d-block text-uppercase fw-bold mb-1">Next EPC Due (10 Years)</small>
                    <input type="date" name="next_date" class="form-control form-control fw-bold text-center border-warning" value="{{ next_year_date }}">
                </div>
            </div>
        </div>

        <div class="row mt-5 align-items-end">
            <div class="col-6">
                <label class="form-label">Assessor Signature</label>
                {% if signature_url %}
                    <div class="border rounded bg-white p-2">
                        <img src="{{ signature_url }}" style="height: 60px; max-width: 100%;">
                    </div>
                {% else %}
                    <canvas id="signature-pad"></canvas>
                    <div class="text-end">
                        <button type="button" class="btn btn-sm btn-link text-muted" onclick="signaturePad.clear()">Clear</button>
                    </div>
                {% endif %}
            </div>
            <div class="col-6 text-end">
                {% if not signature_url %}
                <button type="button" onclick="submitCertificate()" id="btnSubmit" class="btn btn-dark fw-bold btn-lg w-100 shadow">
                    <i class="fas fa-file-pdf me-2"></i> Issue EPC
                </button>
                {% endif %}
            </div>
        </div>
    </form>
</div>

{% if not signature_url %}
<script>
    var canvas = document.getElementById('signature-pad');
    var signaturePad = new SignaturePad(canvas);

    function submitCertificate() {
        if (signaturePad.isEmpty()) {
            alert("Please sign the certificate.");
            return;
        }

        const form = document.getElementById('epcForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        data.signature_img = signaturePad.toDataURL();

        fetch('/office/cert/epc/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                alert("✅ EPC Generated!");
                window.location.href = result.redirect_url || '/office-hub';
            } else {
                alert("Error: " + result.error);
            }
        })
        .catch(err => { alert("Server Error"); console.error(err); });
    }
</script>
{% endif %}

</body>
</html>
