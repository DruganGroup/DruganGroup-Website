<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Viewer | Business Better</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #525659; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR (Dark Mode for Viewer) */
        .sidebar { 
            height: 100vh; 
            width: 260px; 
            position: fixed; 
            background-color: #2c3e50; 
            color: white; 
            padding: 20px; 
            z-index: 1000;
            overflow-y: auto;
        }
        
        .content { margin-left: 260px; height: 100vh; display: flex; flex-direction: column; }
        
        /* PDF FRAME */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #525659;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4 class="fw-bold mb-4"><i class="fas fa-file-invoice-dollar me-2"></i>Invoice Viewer</h4>
        
        <div class="mb-4">
            <label class="small text-muted text-uppercase fw-bold">Client</label>
            <div class="fw-bold">{{ invoice.client_name }}</div>
        </div>
        
        <div class="mb-4">
            <label class="small text-muted text-uppercase fw-bold">Reference</label>
            <div class="fs-5">{{ invoice.reference }}</div>
        </div>

        <div class="mb-4">
            <label class="small text-muted text-uppercase fw-bold">Total Value</label>
            <div class="fs-4 fw-bold text-success">{{ currency }}{{ "%.2f"|format(invoice.total or 0) }}</div>
        </div>
        
        <div class="mb-4">
            <label class="small text-muted text-uppercase fw-bold">Status</label>
            <div class="fs-6 fw-bold text-warning">{{ invoice.status }}</div>
        </div>

        <div class="mb-4">
            <label class="small text-muted text-uppercase fw-bold">Created</label>
            <div class="fs-6 fw-bold">{{ invoice.date }}</div>
        </div>

        <hr class="border-secondary">
        
        <div class="d-grid gap-2 mt-auto">
            <a href="{{ url_for('finance.finance_invoices') }}" class="btn btn-outline-light"><i class="fas fa-arrow-left me-2"></i> Back to Ledger</a>
            
            <a href="{{ url_for('finance.email_invoice', invoice_id=invoice.id) }}" class="btn btn-outline-info" onclick="return confirm('Send this invoice to the client via email?');">
                <i class="fas fa-envelope me-2"></i> Email to Client
            </a>
            
            <a href="/finance/invoice/{{ invoice.id }}/download" class="btn btn-outline-success">
                <i class="fas fa-download me-2"></i> Download PDF
            </a>
        </div>
    </div>

    <div class="content">
        <iframe src="/finance/invoice/{{ invoice.id }}/download#navpanes=0" id="pdfFrame"></iframe>
    </div>

</body>
</html>
